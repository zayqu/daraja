name: Ajira Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Ajira scraper
        env:
          DATABASE_URL: postgresql://neondb_owner:npg_yRf7XoATm3wi@ep-dawn-grass-agjctmsz-pooler.c-2.eu-central-1.aws.neon.tech/daraja?sslmode=require&channel_binding=require
        run: node scraper/sources/ajira.js