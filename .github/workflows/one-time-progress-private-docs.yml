name: One-time private document progress update

on:
  push:
    branches:
      - security/private-candidate-pdf-storage

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/private-candidate-pdf-storage

      - name: Record current production and private document progress
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PROGRESS.md")
          text = path.read_text()
          marker = "## Current batch: Phase 0 private candidate document boundary"
          if marker in text:
              raise SystemExit(0)

          anchor = "## Current batch: Phase 0 framework security and release gate\n"
          section = """## Current batch: Phase 0 private candidate document boundary

- cPanel production release `2782e1e0a9ff4f1bcc3e6d6bcbdb2c663604ec8c`
  was verified live on 28 August 2026 through `/api/health/release` after the
  deployer safely cleared only Daraja's stale LiteSpeed worker on an account
  hosting two Node applications.
- Pull request #90 removes new external `cvUrl` writes and stops returning
  `JobSeeker.cvUrl` or `CandidateDocument.url` from the candidate profile API;
  legacy stored values are preserved for controlled migration rather than
  deleted.
- The private-document storage slice reuses the existing `CandidateDocument`
  model and adds one storage owner plus authenticated upload/download/delete
  routes instead of creating a parallel CV/document system.
- Initial uploads are PDF-only, limited to 4 MB, validate the actual PDF
  signature/trailer, require malware scanning, use private filesystem
  permissions outside the application/public tree, and store only an opaque
  `private-document:<uuid>` locator in the transitional database field.
- Candidate document uploads remain disabled by default with
  `CANDIDATE_DOCUMENT_UPLOADS_ENABLED`; enabling production uploads requires a
  verified ClamAV-compatible scanner plus reviewed private-storage backup,
  restore and deletion handling documented in
  `ops/cpanel/README-private-documents.md`.
- This storage slice is schema-free and deletes no production candidate data.
  The next operational gate is confirming the cPanel scanner/storage capability
  before exposing an upload UI or enabling the feature.

"""
          if anchor not in text:
              raise SystemExit("progress anchor not found")
          path.write_text(text.replace(anchor, section + anchor, 1))
          PY

      - name: Commit progress evidence
        run: |
          if git diff --quiet -- PROGRESS.md; then
            echo "Progress already recorded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESS.md
          git commit -m "Record private document security progress"
          git push origin HEAD:security/private-candidate-pdf-storage
