name: Ajira verified ingestion acceptance tests

on:
  push:
    branches:
      - feature/verified-deadline-editorial-ingestion-20261110
    paths:
      - 'scraper/**'
      - 'lib/job-query.js'
      - 'lib/public-job.js'
      - 'app/api/admin/jobs/**'
      - 'components/AdminJobReviewQueue.js'
      - 'components/admin/AdminRowActions.js'
      - 'app/admin/jobs/page.js'
      - 'scripts/preflight-verified-jobs.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ajira-release-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ajira-release-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run full repository regression suite
        run: npm test
      - name: Check release preflight script syntax
        run: node --check scripts/preflight-verified-jobs.js
