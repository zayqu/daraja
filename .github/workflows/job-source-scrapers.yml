name: Daraja Job Scrapers

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - master
    paths:
      - "scraper/**"
      - ".github/workflows/job-source-scrapers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-source-scrapers-v3
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not configured."
            exit 1
          fi

      - name: Apply database migrations
        run: npx prisma migrate resolve --applied 20260317233531_init || true; npx prisma migrate deploy

      - name: Run enabled source scrapers
        run: npm run scrape
