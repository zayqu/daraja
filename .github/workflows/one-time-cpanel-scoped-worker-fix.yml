name: One-time cPanel scoped worker fix

on:
  push:
    branches:
      - fix/cpanel-scoped-lsnode-restart

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/cpanel-scoped-lsnode-restart

      - name: Edit existing deploy owner and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          deploy_path = Path('ops/cpanel/deploy.sh')
          text = deploy_path.read_text()
          start = text.index('recover_stale_litespeed_worker() {')
          end = text.index('\njobs_api_healthcheck() {', start)
          replacement = r'''app_scoped_lsnode_pids() {
            local app_realpath
            local app_uid
            local pid
            local worker_cwd

            app_realpath="$(readlink -f "$APP_DIR")"
            app_uid="$(id -u "$APP_USER")"

            if ! command -v pgrep >/dev/null 2>&1; then
              return 1
            fi

            while IFS= read -r pid; do
              [[ -n "$pid" ]] || continue
              worker_cwd="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
              if [[ "$worker_cwd" == "$app_realpath" ]]; then
                printf '%s\n' "$pid"
              fi
            done < <(pgrep -u "$app_uid" -f '[l]snode' 2>/dev/null || true)
          }

          terminate_app_scoped_lsnode_workers() {
            local pids
            local pid

            pids="$(app_scoped_lsnode_pids || true)"
            if [[ -z "$pids" ]]; then
              return 1
            fi

            printf 'Clearing stale lsnode worker(s) scoped to %s.\n' "$APP_DIR" >&2
            while IFS= read -r pid; do
              [[ -n "$pid" ]] || continue
              kill "$pid" 2>/dev/null || true
            done <<< "$pids"
          }

          recover_stale_litespeed_worker() {
            local registered_apps
            local app_uid

            printf 'Public frontend does not match the installed release; forcing an application-scoped restart.\n' >&2
            restart_application stop
            sleep "$STALE_WORKER_WAIT_SECONDS"
            restart_application start
            sleep "$STALE_WORKER_WAIT_SECONDS"

            if public_release_healthcheck; then
              return 0
            fi

            if terminate_app_scoped_lsnode_workers; then
              sleep "$STALE_WORKER_WAIT_SECONDS"
              restart_application start
              sleep "$STALE_WORKER_WAIT_SECONDS"
              if public_release_healthcheck; then
                return 0
              fi
            fi

            registered_apps="$(registered_node_app_count 2>/dev/null || true)"
            if [[ "$registered_apps" != "1" ]]; then
              printf 'No Daraja-scoped stale lsnode worker could be safely identified; refusing account-wide cleanup because %s Node applications are registered.\n' \
                "${registered_apps:-an unknown number of}" >&2
              return 1
            fi

            if ! command -v pkill >/dev/null 2>&1; then
              printf 'pkill is required to clear a stale LiteSpeed lsnode worker.\n' >&2
              return 1
            fi

            app_uid="$(id -u "$APP_USER")"
            printf 'Clearing stale lsnode workers for the single registered Node application.\n' >&2
            pkill -u "$app_uid" -f '[l]snode' || true
            sleep "$STALE_WORKER_WAIT_SECONDS"
            restart_application start
            sleep "$STALE_WORKER_WAIT_SECONDS"
            public_release_healthcheck
          }
          '''
          # Keep shell functions at column zero.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          deploy_path.write_text(text[:start] + replacement + text[end + 1:])

          test_path = Path('test/cpanel-deploy.test.js')
          tests = test_path.read_text()
          test_start = tests.index('test("cPanel deployment recovers a stale LiteSpeed worker with bounded scope"')
          test_end = tests.index('\ntest("cPanel deployment automatically restores the previous frontend on failure"', test_start)
          test_replacement = '''test("cPanel deployment recovers a stale LiteSpeed worker with bounded scope", () => {
            assert.match(deployScript, /restart_application stop/);
            assert.match(deployScript, /restart_application start/);
            assert.match(deployScript, /app_scoped_lsnode_pids/);
            assert.match(deployScript, /readlink -f "\\/proc\\/\\$pid\\/cwd"/);
            assert.match(deployScript, /worker_cwd" == "\\$app_realpath/);
            assert.match(deployScript, /pgrep -u "\\$app_uid" -f '\\[l\\]snode'/);
            assert.match(deployScript, /terminate_app_scoped_lsnode_workers/);
            assert.match(deployScript, /kill "\\$pid"/);
            assert.match(deployScript, /registered_node_app_count/);
            assert.match(deployScript, /registered_apps" != "1/);
            assert.match(deployScript, /pkill -u "\\$app_uid" -f '\\[l\\]snode'/);
            assert.match(deployScript, /touch "\\$APP_DIR\\/tmp\\/restart\\.txt"/);
            assert.match(
              deployScript,
              /REMOTE_COMMIT" == "\\$CURRENT_COMMIT"[\\s\\S]+public_release_healthcheck/,
            );
            assert.doesNotMatch(deployScript, /pkill (?:node|-f ['"]?lsnode)/);
          });
          '''
          test_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_replacement.splitlines()) + '\n'
          test_path.write_text(tests[:test_start] + test_replacement + tests[test_end + 1:])
          PY

      - name: Validate shell and focused test
        run: |
          bash -n ops/cpanel/deploy.sh
          node --test test/cpanel-deploy.test.js

      - name: Commit scoped worker fix
        run: |
          if git diff --quiet -- ops/cpanel/deploy.sh test/cpanel-deploy.test.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/cpanel/deploy.sh test/cpanel-deploy.test.js
          git commit -m "Scope stale cPanel worker cleanup to Daraja"
          git push origin HEAD:fix/cpanel-scoped-lsnode-restart
