name: One-time Next.js security refresh

on:
  push:
    branches:
      - security/next-august-2026

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/next-august-2026

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched Next.js lockfile
        run: npm install --save-exact --package-lock-only next@16.3.3 eslint-config-next@16.3.3

      - name: Commit dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js for August 2026 security release"
          git push origin HEAD:security/next-august-2026
