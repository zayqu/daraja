name: One-time runtime dependency audit

on:
  push:
    branches:
      - security/next-august-2026

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Show runtime audit evidence
        run: npm audit --omit=dev --json || true
