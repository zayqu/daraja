name: One-time cPanel no-dev-fd fix

on:
  push:
    branches:
      - fix/cpanel-no-dev-fd

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/cpanel-no-dev-fd

      - name: Edit existing deploy owner and test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          deploy_path = Path("ops/cpanel/deploy.sh")
          text = deploy_path.read_text()

          text = text.replace(
              "  local app_uid\n  local pid\n  local worker_cwd\n",
              "  local app_uid\n  local candidate_pids\n  local pid\n  local worker_cwd\n",
              1,
          )

          marker = "  if ! command -v pgrep >/dev/null 2>&1; then\n    return 1\n  fi\n\n"
          replacement = marker + "  candidate_pids=\"$(pgrep -u \"$app_uid\" -f '[l]snode' 2>/dev/null || true)\"\n  if [[ -z \"$candidate_pids\" ]]; then\n    return 1\n  fi\n\n"
          if marker not in text:
              raise SystemExit("expected pgrep guard not found")
          text = text.replace(marker, replacement, 1)

          old_loop_end = "  done < <(pgrep -u \"$app_uid\" -f '[l]snode' 2>/dev/null || true)\n"
          new_loop_end = "  done <<< \"$candidate_pids\"\n"
          if old_loop_end not in text:
              raise SystemExit("expected process-substitution loop not found")
          text = text.replace(old_loop_end, new_loop_end, 1)
          deploy_path.write_text(text)

          test_path = Path("test/cpanel-deploy.test.js")
          tests = test_path.read_text()
          anchor = "  assert.match(deployScript, /terminate_app_scoped_lsnode_workers/);\n"
          addition = anchor + "  assert.match(deployScript, /candidate_pids/);\n  assert.match(deployScript, /done <<< \\\"\\$candidate_pids\\\"/);\n  assert.doesNotMatch(deployScript, /done < <\\(pgrep/);\n"
          if anchor not in tests:
              raise SystemExit("expected scoped worker assertion not found")
          test_path.write_text(tests.replace(anchor, addition, 1))
          PY

      - name: Validate shell and focused test
        run: |
          bash -n ops/cpanel/deploy.sh
          node --test test/cpanel-deploy.test.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/cpanel/deploy.sh test/cpanel-deploy.test.js
          git commit -m "Avoid dev-fd process substitution in cPanel deployer"
          git push origin HEAD:fix/cpanel-no-dev-fd
